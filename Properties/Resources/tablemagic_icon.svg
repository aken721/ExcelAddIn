<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Excel风格深绿渐变背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E7A3E"/>
      <stop offset="35%" style="stop-color:#217346"/>
      <stop offset="70%" style="stop-color:#1A6838"/>
      <stop offset="100%" style="stop-color:#145530"/>
    </linearGradient>
    <!-- 3D 底部阴影层 -->
    <linearGradient id="bgBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F3D20"/>
      <stop offset="100%" style="stop-color:#0A2A15"/>
    </linearGradient>
    <!-- 3D 左侧阴影 -->
    <linearGradient id="bgLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0F3D20"/>
      <stop offset="100%" style="stop-color:#0F3D2000"/>
    </linearGradient>
    <!-- 卡片绿色渐变 -->
    <linearGradient id="cardGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3DDC84"/>
      <stop offset="100%" style="stop-color:#2EBB6A"/>
    </linearGradient>
    <!-- 卡片蓝色渐变 -->
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B8CFF"/>
      <stop offset="100%" style="stop-color:#5B6BBF"/>
    </linearGradient>
    <!-- 卡片金色渐变 -->
    <linearGradient id="cardGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE066"/>
      <stop offset="100%" style="stop-color:#FFB800"/>
    </linearGradient>
    <!-- 卡片PDF红色渐变 -->
    <linearGradient id="cardRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5252"/>
      <stop offset="100%" style="stop-color:#D32F2F"/>
    </linearGradient>
    <!-- 卡片白色 -->
    <linearGradient id="cardWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F8FFFE"/>
    </linearGradient>
    <!-- 魔法棒渐变 -->
    <linearGradient id="wandBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0722A"/>
      <stop offset="50%" style="stop-color:#8B5E20"/>
      <stop offset="100%" style="stop-color:#6B4A18"/>
    </linearGradient>
    <linearGradient id="wandTip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE8A0"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <!-- 3D 卡片正面渐变叠加 -->
    <linearGradient id="cardShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="50%" style="stop-color:#FFFFFF00"/>
    </linearGradient>
    <!-- 光影滤镜 -->
    <filter id="shadow3d" x="-15%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00000040"/>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000025"/>
    </filter>
    <filter id="cardShadowDeep">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
    <filter id="wandGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== 3D 背景层 ==================== -->
  <!-- 底部3D厚度 -->
  <rect x="37" y="42" width="448" height="448" rx="96" ry="96" fill="url(#bgBottom)" opacity="0.6"/>
  <!-- 左侧3D厚度 -->
  <rect x="42" y="37" width="448" height="448" rx="96" ry="96" fill="url(#bgLeft)" opacity="0.3"/>
  <!-- 主背景 -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGrad)" filter="url(#shadow3d)"/>
  <!-- 背景高光 -->
  <ellipse cx="180" cy="160" rx="200" ry="150" fill="#FFFFFF" opacity="0.04"/>

  <!-- ==================== 九宫格功能卡片 ==================== -->

  <!-- ===== Row 1 ===== -->
  <!-- 表格 - 绿色主卡 -->
  <g filter="url(#cardShadowDeep)">
    <rect x="68" y="88" width="120" height="110" rx="18" fill="url(#cardGreen)"/>
    <rect x="68" y="88" width="120" height="55" rx="18" fill="url(#cardShine)" opacity="0.3"/>
    <rect x="68" y="120" width="120" height="23" fill="#FFFFFF" opacity="0.08"/>
    <g transform="translate(128, 140)" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.95">
      <rect x="-22" y="-20" width="44" height="40" rx="4"/>
      <line x1="-22" y1="-8" x2="22" y2="-8"/>
      <line x1="-22" y1="4" x2="22" y2="4"/>
      <line x1="-22" y1="14" x2="22" y2="14"/>
      <line x1="-7" y1="-20" x2="-7" y2="20"/>
      <line x1="8" y1="-20" x2="8" y2="20"/>
    </g>
  </g>

  <!-- 自动化 - 蓝色卡 -->
  <g filter="url(#cardShadow)">
    <rect x="196" y="88" width="120" height="110" rx="18" fill="url(#cardBlue)"/>
    <rect x="196" y="88" width="120" height="55" rx="18" fill="url(#cardShine)" opacity="0.2"/>
    <g transform="translate(256, 140)" fill="#FFFFFF" opacity="0.9">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="5.5" fill="#FFFFFF"/>
      <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="-18" x2="0" y2="-13"/>
        <line x1="0" y1="13" x2="0" y2="18"/>
        <line x1="-18" y1="0" x2="-13" y2="0"/>
        <line x1="13" y1="0" x2="18" y2="0"/>
        <line x1="-12" y1="-12" x2="-9" y2="-9"/>
        <line x1="9" y1="9" x2="12" y2="12"/>
        <line x1="12" y1="-12" x2="9" y2="-9"/>
        <line x1="-9" y1="9" x2="-12" y2="12"/>
      </g>
    </g>
  </g>

  <!-- AI/星星 - 金色卡 -->
  <g filter="url(#cardShadow)">
    <rect x="324" y="88" width="120" height="110" rx="18" fill="url(#cardGold)"/>
    <rect x="324" y="88" width="120" height="55" rx="18" fill="url(#cardShine)" opacity="0.3"/>
    <g transform="translate(384, 140)" fill="#FFFFFF" filter="url(#starGlow)">
      <polygon points="0,-20 5,-7 19,-7 8,2 12,16 0,9 -12,16 -8,2 -19,-7 -5,-7"/>
    </g>
  </g>

  <!-- ===== Row 2 ===== -->
  <!-- PDF - 红色卡（与Adobe PDF品牌色一致） -->
  <g filter="url(#cardShadow)">
    <rect x="68" y="206" width="120" height="110" rx="18" fill="url(#cardRed)"/>
    <rect x="68" y="206" width="120" height="55" rx="18" fill="url(#cardShine)" opacity="0.25"/>
    <g transform="translate(128, 258)">
      <!-- PDF文件图标 -->
      <rect x="-16" y="-20" width="32" height="40" rx="3" fill="#FFFFFF" opacity="0.25"/>
      <polygon points="16,-20 16,-10 6,-20" fill="#FFFFFF" opacity="0.35"/>
      <!-- PDF文字 -->
      <text x="0" y="10" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" opacity="0.95">PDF</text>
    </g>
  </g>

  <!-- 邮件 - 绿色半透明卡 -->
  <g filter="url(#cardShadow)" opacity="0.8">
    <rect x="196" y="206" width="120" height="110" rx="18" fill="url(#cardGreen)"/>
    <rect x="196" y="206" width="120" height="55" rx="18" fill="url(#cardShine)" opacity="0.2"/>
    <g transform="translate(256, 258)" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round">
      <rect x="-20" y="-14" width="40" height="30" rx="4"/>
      <polyline points="-20,-14 0,4 20,-14"/>
    </g>
  </g>

  <!-- 数据库 - 蓝色半透明卡 -->
  <g filter="url(#cardShadow)" opacity="0.8">
    <rect x="324" y="206" width="120" height="110" rx="18" fill="url(#cardBlue)"/>
    <rect x="324" y="206" width="120" height="55" rx="18" fill="url(#cardShine)" opacity="0.15"/>
    <g transform="translate(384, 255)" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9">
      <ellipse cx="0" cy="-12" rx="18" ry="7"/>
      <line x1="-18" y1="-12" x2="-18" y2="12"/>
      <line x1="18" y1="-12" x2="18" y2="12"/>
      <ellipse cx="0" cy="12" rx="18" ry="7"/>
      <path d="M-18,0 Q-18,7 0,7 Q18,7 18,0" opacity="0.5"/>
    </g>
  </g>

  <!-- ===== Row 3 ===== -->
  <!-- 图表 - 金色半透明卡 -->
  <g filter="url(#cardShadow)" opacity="0.75">
    <rect x="68" y="324" width="120" height="110" rx="18" fill="url(#cardGold)"/>
    <rect x="68" y="324" width="120" height="55" rx="18" fill="url(#cardShine)" opacity="0.3"/>
    <g transform="translate(128, 376)" fill="#FFFFFF" opacity="0.9">
      <rect x="-20" y="2" width="11" height="16" rx="2.5"/>
      <rect x="-5" y="-10" width="11" height="28" rx="2.5"/>
      <rect x="10" y="-18" width="11" height="36" rx="2.5"/>
      <line x1="-22" y1="20" x2="22" y2="20" stroke="#FFFFFF" stroke-width="2.5"/>
    </g>
  </g>

  <!-- OCR - 绿色淡卡 -->
  <g filter="url(#cardShadow)" opacity="0.65">
    <rect x="196" y="324" width="120" height="110" rx="18" fill="url(#cardGreen)"/>
    <rect x="196" y="324" width="120" height="55" rx="18" fill="url(#cardShine)" opacity="0.15"/>
    <g transform="translate(256, 376)" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85">
      <rect x="-18" y="-14" width="36" height="28" rx="4"/>
      <line x1="-11" y1="-5" x2="11" y2="-5"/>
      <line x1="-11" y1="2" x2="7" y2="2"/>
      <line x1="-11" y1="9" x2="3" y2="9"/>
    </g>
  </g>

  <!-- 音乐 - 蓝色淡卡 -->
  <g filter="url(#cardShadow)" opacity="0.6">
    <rect x="324" y="324" width="120" height="110" rx="18" fill="url(#cardBlue)"/>
    <rect x="324" y="324" width="120" height="55" rx="18" fill="url(#cardShine)" opacity="0.1"/>
    <g transform="translate(384, 376)" fill="#FFFFFF" opacity="0.85">
      <circle cx="-8" cy="8" r="7"/>
      <circle cx="12" cy="4" r="7"/>
      <rect x="-2" y="-14" width="3.5" height="22" rx="1"/>
      <rect x="18" y="-18" width="3.5" height="22" rx="1"/>
      <line x1="1.5" y1="-14" x2="21.5" y2="-18" stroke="#FFFFFF" stroke-width="3.5"/>
    </g>
  </g>

  <!-- ==================== 魔法棒（对角线位置） ==================== -->
  <g transform="rotate(-40, 256, 256)" filter="url(#wandGlow)">
    <!-- 棒身 -->
    <rect x="230" y="100" width="14" height="180" rx="7" fill="url(#wandBody)"/>
    <!-- 棒身高光 -->
    <rect x="232" y="100" width="5" height="180" rx="2.5" fill="#FFFFFF" opacity="0.15"/>
    <!-- 棒尖（白色尖端） -->
    <polygon points="237,100 244,72 250,100" fill="url(#wandTip)"/>
    <!-- 棒尖发光 -->
    <circle cx="244" cy="70" r="12" fill="#FFE8A0" opacity="0.5"/>
    <circle cx="244" cy="68" r="6" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- ==================== 魔法粒子轨迹 ==================== -->
  <!-- 沿魔法棒方向的粒子 -->
  <circle cx="210" cy="110" r="4.5" fill="#FFE8A0" opacity="0.9" filter="url(#starGlow)"/>
  <circle cx="195" cy="95" r="3.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="180" cy="82" r="3" fill="#3DDC84" opacity="0.7"/>
  <circle cx="168" cy="70" r="2.5" fill="#FFE8A0" opacity="0.6"/>
  <circle cx="220" cy="98" r="3" fill="#7B8CFF" opacity="0.7"/>
  <circle cx="185" cy="88" r="2" fill="#FFFFFF" opacity="0.5"/>
  <!-- 红色粒子（呼应PDF红色卡） -->
  <circle cx="140" cy="235" r="2.5" fill="#FF5252" opacity="0.6"/>
  <circle cx="155" cy="218" r="1.8" fill="#FF5252" opacity="0.4"/>

  <!-- 四角装饰星星 -->
  <g transform="translate(85, 75)" fill="#FFE8A0" opacity="0.7" filter="url(#starGlow)">
    <polygon points="0,-7 2,-2 7,-2 3,1 4,6 0,3 -4,6 -3,1 -7,-2 -2,-2"/>
  </g>
  <g transform="translate(430, 85)" fill="#FFE8A0" opacity="0.5" filter="url(#starGlow)">
    <polygon points="0,-8 2.5,-3 8,-3 3.5,1 5,7 0,3.5 -5,7 -3.5,1 -8,-3 -2.5,-3"/>
  </g>
  <g transform="translate(440, 420)" fill="#FFE8A0" opacity="0.4">
    <polygon points="0,-6 1.5,-2 6,-2 2.5,0.5 3.5,5 0,2.5 -3.5,5 -2.5,0.5 -6,-2 -1.5,-2"/>
  </g>
  <g transform="translate(75, 440)" fill="#FFE8A0" opacity="0.35">
    <polygon points="0,-6 1.5,-2 6,-2 2.5,0.5 3.5,5 0,2.5 -3.5,5 -2.5,0.5 -6,-2 -1.5,-2"/>
  </g>

  <!-- 额外散落粒子 -->
  <circle cx="420" cy="150" r="2.5" fill="#FFE8A0" opacity="0.5"/>
  <circle cx="100" cy="180" r="2" fill="#3DDC84" opacity="0.4"/>
  <circle cx="400" cy="350" r="2" fill="#7B8CFF" opacity="0.35"/>
  <circle cx="110" cy="320" r="1.5" fill="#FFFFFF" opacity="0.3"/>
</svg>
